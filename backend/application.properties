# --- Database connection ---
# MySQL example:
spring.datasource.url=jdbc:mysql://localhost:3306/openpdf
spring.datasource.username=your_db_user
spring.datasource.password=your_db_password

# PostgreSQL example (swap the driver dependency + url instead):
# spring.datasource.url=jdbc:postgresql://localhost:5432/openpdf

# --- JPA / Hibernate ---
# "update" auto-creates/updates the users table from the User entity — fine for dev,
# switch to a migration tool (Flyway/Liquibase) with ddl-auto=validate for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
